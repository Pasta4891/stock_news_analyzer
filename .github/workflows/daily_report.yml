# GitHub Actions 排程：不用自己的電腦/伺服器一直開著，
# 由 GitHub 在雲端幫你每天自動執行 python -m src.main。
#
# 設定步驟：
# 1. 把整個專案 push 到 GitHub repo
# 2. 到 repo 的 Settings -> Secrets and variables -> Actions -> New repository secret
#    依序新增以下 5 個 secret（名稱要完全一致）：
#      ALPHA_VANTAGE_API_KEY
#      GEMINI_API_KEY
#      EMAIL_SENDER
#      EMAIL_PASSWORD
#      EMAIL_RECEIVER
# 3. 之後每天 UTC 00:00（台灣時間早上08:00）會自動執行一次，
#    也可以到 repo 的 Actions 頁籤手動點選 "Run workflow" 立即測試。

name: Daily Stock News Report

on:
  schedule:
    # UTC 00:00 = 台灣時間 08:00（台灣沒有日光節約時間，這個對應是固定的）
    - cron: "0 0 * * *"
  workflow_dispatch: {}  # 允許手動觸發，方便測試

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 專案原始碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行報告主程式
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python -m src.main
